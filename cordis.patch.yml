# ============================================================================
# agent-live —— DSH bundle patch（插件自带的挂载声明）
# ============================================================================
# profile 的 dsh.profile.bundles 里列出本包名之后，这一条会被解析并 insert 进配置树。
# 教训（2026-10-22，来自 dsh-memory-board）：只往 profile 自己的 cordis.patch.yml 里手写、
# 却没把包名放进 bundles，DSH 会静默跳过整层 patch —— 路由一直 401 就是这个原因。
# ============================================================================

- insert:
    - id: agent-live
      name: agent-live
      config: {}
